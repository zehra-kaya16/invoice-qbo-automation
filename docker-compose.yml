services:
  app:
    build: .
    ports:
      - "8000:8000"

    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://receiptai:receiptai@db:5432/receiptai
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/app/uploads

    env_file:
      - .env

    volumes:
      - upload_data:/app/uploads
      - ./app:/app/app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    restart: unless-stopped


  db:
    image: postgres:16-alpine

    environment:
      - POSTGRES_USER=receiptai
      - POSTGRES_PASSWORD=receiptai
      - POSTGRES_DB=receiptai

    volumes:
      - postgres_data:/var/lib/postgresql/data

    ports:
      - "127.0.0.1:5432:5432"

    restart: unless-stopped


    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20


  redis:
    image: redis:7-alpine

    ports:
      - "127.0.0.1:6379:6379"

    restart: unless-stopped


  worker:
    profiles: ["worker-tools"]
    build: .

    environment:
      - APP_ENV=development
      - DATABASE_URL=postgresql://receiptai:receiptai@db:5432/receiptai
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_TYPE=local
      - LOCAL_STORAGE_PATH=/app/uploads

    env_file:
      - .env

    volumes:
      - upload_data:/app/uploads
      - ./app:/app/app

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

    entrypoint: ["celery"]
    command: ["-A", "app.tasks:celery_app", "worker", "--loglevel=info"]

    healthcheck:
      disable: true
      
    restart: unless-stopped

volumes:
  postgres_data:
  upload_data: